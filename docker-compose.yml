# docker compose up -d        app on http://localhost:8290
# With a Cloudflare tunnel token in .env (TUNNEL_TOKEN=...), `--profile tunnel` also publishes it
# (point the tunnel's public hostname, e.g. dino.umarbek.dev, at http://app:8290).
services:
  app:
    build: .
    ports: ["127.0.0.1:8290:8290"]
    env_file: [.env]             # NVIDIA_API_KEY for the chat; TRUST_ADMIN_TOKEN only if adding projects
    volumes:
      - state:/state             # decisions.json
      - suite:/app/suite         # saved tests (merges promote into it)
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    env_file: [.env]             # TUNNEL_TOKEN
    depends_on: [app]
    restart: unless-stopped
volumes:
  state:
  suite:
